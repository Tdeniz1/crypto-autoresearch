[project]
name = "crypto-autoresearch"
version = "0.1.0"
description = "Ratchet-style crypto strategy research harness (backtest-only, leakage-hardened)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "anthropic>=0.60",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
